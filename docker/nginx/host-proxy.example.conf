# ==============================================================================
# Exemplo de Configuração de Proxy Reverso Nginx (Host Externo)
#
# Este arquivo serve de modelo para ser copiado para o servidor host:
#   sudo cp host-proxy.example.conf /etc/nginx/sites-available/meudominio.com.conf
#   sudo ln -s /etc/nginx/sites-available/meudominio.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Pré-requisito (Suporte a WebSocket no Host):
# Certifique-se de que o arquivo /etc/nginx/conf.d/websocket.conf contenha:
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       '' close;
#   }
#
# Mapeamento de Portas e Serviços:
#   - S3 API (Upload / Download de arquivos)
#       Container MinIO: 9000 -> Gateway Nginx Docker: 9000 -> Host: 7104 (PORT_MINIO_API)
#       Endpoint Público: https://s3.tiagofranca.com
#
#   - Console Web (Painel de Gestão Gráfica MinIO)
#       Container MinIO: 9001 -> Gateway Nginx Docker: 9001 -> Host: 7105 (PORT_MINIO_CONSOLE)
#       Endpoint Público: https://cdn.tiagofranca.com
# ==============================================================================


# ------------------------------------------------------------------------------
# 1. MinIO S3 API - https://s3.tiagofranca.com
# Utilizado por SDKs (AWS SDK, boto3, MinIO Client, Laravel S3 Driver)
# e para acesso público direto aos arquivos sem autenticação.
# ------------------------------------------------------------------------------

# Redirecionamento HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name s3.tiagofranca.com storage.tiagofranca.com;

    # Certbot ACME Challenge para emissão/renovação de certificados SSL
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://$host$request_uri;
}

# Servidor Seguro HTTPS (S3 API)
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name s3.tiagofranca.com storage.tiagofranca.com;

    # Certificados SSL (Let's Encrypt ou Cloudflare Origin CA)
    ssl_certificate /etc/ssl/certs/tiagofranca_origin.pem;
    ssl_certificate_key /etc/ssl/private/tiagofranca_origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Sem limite de body (permite upload de arquivos grandes)
    client_max_body_size 0;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        # Porta S3 API exposta no Host pelo docker-compose (PORT_MINIO_API=7104)
        # Internamente mapeada para o MinIO:9000
        proxy_pass http://127.0.0.1:7104;
        proxy_http_version 1.1;

        # Preserva o Host original da requisição (crítico para validação de assinaturas AWS S3)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-NginX-Proxy true;

        # Timeouts longos para uploads/downloads de grande porte
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering desativado para transmissão direta de stream
        proxy_buffering off;
        proxy_request_buffering off;
    }
}


# ------------------------------------------------------------------------------
# 2. MinIO Console Web - https://cdn.tiagofranca.com
# Interface Web administrativa do MinIO (Login, Buckets, Políticas, Monitoramento)
# ------------------------------------------------------------------------------

# Redirecionamento HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name cdn.tiagofranca.com;

    # Certbot ACME Challenge para emissão/renovação de certificados SSL
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://$host$request_uri;
}

# Servidor Seguro HTTPS (Console Web)
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name cdn.tiagofranca.com;

    # Certificados SSL (Let's Encrypt ou Cloudflare Origin CA)
    ssl_certificate /etc/ssl/certs/tiagofranca_origin.pem;
    ssl_certificate_key /etc/ssl/private/tiagofranca_origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Sem limite de body (permite upload direto pelo navegador)
    client_max_body_size 0;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        # Porta Console Web exposta no Host pelo docker-compose (PORT_MINIO_CONSOLE=7105)
        # Internamente mapeada para o MinIO:9001
        proxy_pass http://127.0.0.1:7105;
        proxy_http_version 1.1;

        # Suporte a WebSocket (essencial para o funcionamento do painel MinIO /ws/...)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Cabeçalhos de proxy
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-NginX-Proxy true;

        # Timeouts longos
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering desativado
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
